<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador | Ferretería El Constructor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1>Panel Administrativo</h1>
            <p>Ferretería El Constructor</p>
        </div>

        <div id="login-alert" class="login-alert danger"></div>

        <form id="login-form">
            <div class="form-group" style="margin-bottom: 16px;">
                <label class="form-label" for="login-email">Correo electrónico</label>
                <input type="email" id="login-email" class="form-control" placeholder="admin@elconstructor.com" required autocomplete="email">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" for="login-password">Contraseña</label>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btn-login-submit" class="btn-admin btn-admin-primary" style="width: 100%; justify-content: center; padding: 11px;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar Sesión
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <a href="/" style="color: var(--admin-text-muted); font-size: 13px; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Volver a la tienda
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/utils.js"></script>

    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('login-alert');
        const submitBtn = document.getElementById('btn-login-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';

            try {
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                location.href = '/admin/index.html';
            } catch (err) {
                console.error(err);
                alertBox.textContent = 'Credenciales inválidas o usuario no autorizado.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
